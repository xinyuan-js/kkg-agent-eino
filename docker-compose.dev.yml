services:
  workspace:
    image: mcr.microsoft.com/devcontainers/go:1-1.24-bookworm
    command: sleep infinity
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace:cached
      - go-cache:/go
      - node-cache:/workspace/apps/web/node_modules
    depends_on:
      - postgres
      - redis
      - minio
    extra_hosts:
      - host.docker.internal:host-gateway

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kkg_agent
      POSTGRES_PASSWORD: kkg_agent
      POSTGRES_DB: kkg_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kkg_agent
      MINIO_ROOT_PASSWORD: kkg_agent_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  go-cache:
  node-cache:
  postgres-data:
  minio-data:
