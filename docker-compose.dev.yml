services:
  workspace:
    image: mcr.microsoft.com/devcontainers/go:1-1.24-bookworm
    command: sleep infinity
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace:cached
      - go-cache:/go
      - node-cache:/workspace/apps/web/node_modules
    depends_on:
      - postgres
      - redis
      - minio
      - api
      - web
    extra_hosts:
      - host.docker.internal:host-gateway

  api:
    image: mcr.microsoft.com/devcontainers/go:1-1.24-bookworm
    working_dir: /workspace/apps/api
    command: sh -lc "go mod download && go run ./cmd/agent-api"
    env_file:
      - .env
    environment:
      AGENT_API_PORT: "8088"
      POSTGRES_DSN: postgres://kkg_agent:kkg_agent@postgres:5432/kkg_agent?sslmode=disable
      REDIS_ADDR: redis:6379
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/workspace:cached
      - go-cache:/go
    ports:
      - "8088:8088"
    depends_on:
      - postgres
      - redis
      - minio
    extra_hosts:
      - host.docker.internal:host-gateway

  web:
    image: node:22-bookworm
    working_dir: /workspace/apps/web
    command: sh -lc "npm install && npm run dev"
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_AGENT_API_BASE: /agent-api
      NUXT_AGENT_API_TARGET: http://api:8088
    volumes:
      - .:/workspace:cached
      - node-cache:/workspace/apps/web/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kkg_agent
      POSTGRES_PASSWORD: kkg_agent
      POSTGRES_DB: kkg_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kkg_agent
      MINIO_ROOT_PASSWORD: kkg_agent_secret
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data

volumes:
  go-cache:
  node-cache:
  postgres-data:
  minio-data:
